name: e_drive
description: e-Drive — ride-hailing app (Clean Architecture + Riverpod)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # DI
  get_it: ^7.6.7

  # Networking
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Routing
  go_router: ^13.2.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Error handling
  dartz: ^0.10.1

  # Utilities
  equatable: ^2.0.5
  logger: ^2.2.0
  intl: ^0.19.0
  flutter_launcher_icons: ^0.14.4

  # UI / Maps
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.1
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2

  # Payments
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.3.0

  # Realtime (for ride tracking)
  socket_io_client: ^2.0.3+1

 
 
  # Places autocomplete
  #flutter_google_places_sdk: ^0.4.2
 
 
 
  # Permission handling
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    - assets/lottie/
